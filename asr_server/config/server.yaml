# asr_server configuration. Replaces the former command-line flags of server.py.
# Defaults follow the native-vLLM + Silero server. Unknown keys are rejected.

server:
  host: 0.0.0.0
  port: 50051
  max_streams: 64            # gRPC maximum_concurrent_rpcs; not a measured capacity
  ingress_max_ms: 3000       # audio allowed to wait for ASR per stream; above it the stream is
                             # closed with RESOURCE_EXHAUSTED. 0 = unlimited
  audio_timeout_ms: 2000     # open utterance and no audio for this long -> commit. 0 = disabled

asr:
  enabled: true              # task speech_to_text. false: Qwen3-ASR, VAD and punctuation are not
                             # loaded (no GPU needed) and speech_to_text ends with UNIMPLEMENTED
  backend: native_vllm       # native_vllm: vllm.LLM.chat(), language auto-detected
                             # qwen_asr:    qwen_asr package streaming state
  model: /opt/models/Qwen3-ASR-1.7B
  chunk_sec: 1.0             # audio between two PARTIAL inferences
  max_utterance_sec: 15.0    # forced split to bound GPU cost
  max_new_tokens: 256
  gpu_memory_utilization: 0.75
  max_model_len: 8192        # native_vllm only
  max_num_seqs: 1            # native_vllm only
  dtype: float16             # native_vllm only: auto | float16 | bfloat16
  enforce_eager: false       # native_vllm only: true disables CUDA graphs to reduce VRAM
  max_consecutive_errors: 3  # model failures in a row before the stream is closed (UNAVAILABLE)
  partial_max_backlog_ms: 500  # more audio than this waiting in the stream's queue: skip the PARTIAL
                             # inference and keep the audio for the next one. A FINAL is always
                             # inferred. 0 = never skip (use it for --fast throughput measurements)
  use_language_source: false # true: AudioChunk.language_source overrides AudioChunk.language
  log_results: false         # true: one INFO line per PARTIAL and COMMIT with the language, the model
                             # answer and the text. The log then holds the content of the calls
  default_language: vi       # vi | en | auto: language of a stream whose AudioChunk.language is empty
                             # or unknown. auto = the model detects it
  force_language: false      # native_vllm. true: the model transcribes the language of the stream
                             # (vi, en) instead of detecting it; auto is still detected. Needs the
                             # chat template in the model directory

vad:
  backend: silero            # silero | webrtc
  silero_model: /opt/models/silero_vad.jit   # local TorchScript file, required for silero
  threshold: 0.5             # silero: speech onset probability
  neg_threshold: null        # silero: speech exit probability; null = threshold - 0.15
  workers: 2                 # threads that load and run Silero (CPU)
  mode: 2                    # webrtc only: aggressiveness, 0..3
  endpoint_ms: 600           # silence that commits an utterance
  pause_ms: 300              # pause candidate for semantic early commit
  min_voiced_ms: 160         # utterances with less voiced audio are discarded

punctuation:
  model: /opt/models/punctuation-restoration-small
  device: cpu
  threshold: 0.55
  workers: 1                 # punctuation threads
  partial_timeout_ms: 300    # PARTIAL falls back to unpunctuated text after this
  commit_timeout_ms: 1000    # COMMIT falls back to raw_text after this

semantic:
  early_commit: false        # optional early commit on a confident terminal mark
  confidence: 0.90
  stable_updates: 2

word_reveal:
  enabled: false             # true: the text of a PARTIAL grows word by word
  window_ms: 400             # new words are shown within this time; not longer than asr.chunk_sec
  min_interval_ms: 120       # minimum time between two results sent on a stream

noise_reduction:             # task noise_reduction: DPDFNet-2 on CPU, audio back for every chunk
  enabled: false             # false: noise_reduction ends with UNIMPLEMENTED (the gateway plays the
                             # original audio). true needs sherpa-onnx and the model file
  model: /opt/models/dpdfnet2.onnx   # local file, never downloaded by the server
  frame_ms: 20               # audio per result: 20 | 40 | 80
  num_threads: 1             # ONNX threads of each denoiser
  workers: 2                 # threads that run the denoisers of all streams
  max_streams: 16            # denoisers loaded at start (~20 MB each); one more stream ->
                             # RESOURCE_EXHAUSTED. Not above server.max_streams. Choose it from a
                             # measurement on the target CPU, not from the number of calls
  max_backlog_ms: 500        # more audio than this waiting for the model (the CPU does not keep up):
                             # the stream ends with RESOURCE_EXHAUSTED and the gateway plays the
                             # original audio for the rest of the call. 0 = no limit, at most 5000

asr_denoise:                 # speech_to_text: DPDFNet-2 (CPU) in front of VAD and ASR
  enabled: false             # false: VAD and ASR get the audio as sent. true needs sherpa-onnx and
                             # the model file, and asr.enabled
  model: /opt/models/dpdfnet2.onnx   # local file, never downloaded by the server
  apply_to: wideband         # wideband: only calls the gateway carries as G.722 or L16; G.711 calls
                             # go through as sent (DPDFNet-2 turned down much of their speech).
                             # all: every stream (tests only)
  num_threads: 1             # ONNX threads of each denoiser
  workers: 2                 # threads that run the denoisers of all streams
  max_streams: 16            # denoisers loaded at start (~20 MB each); a stream that finds none
                             # free is recognised from the audio as sent. Not above server.max_streams
  max_backlog_ms: 500        # more audio than this waiting for the model (the CPU does not keep up),
                             # or one model call this long: the stream goes on with the audio as sent,
                             # from the next sample. At most 5000. 0 = no limit, test servers only
                             # (tools/eval --fast): a stuck model call would then hold the stream
