[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr_server"
version = "0.1.0"
description = "Qwen3-ASR gRPC server: native vLLM, Silero VAD, punctuation, immutable commits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "grpcio>=1.60,<2",
    "protobuf>=4.25,<7",
    "soxr>=0.5,<2",
    "transformers>=4.57,<6",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "soundfile>=0.12"]
webrtc = ["webrtcvad-wheels>=2.0.14"]      # vad.backend: webrtc

[project.scripts]
asr-server = "asr_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asr_server.proto" = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
